{{- if and (not .Values.s3.existingSecret) .Values.s3.credentials.accessKey .Values.s3.credentials.accessKeySecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "s3-image-viewer.secretName" . }}
  labels:
    {{- include "s3-image-viewer.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.s3.accessKey }}: {{ .Values.s3.credentials.accessKey | quote }}
  {{ .Values.s3.accessKeySecret }}: {{ .Values.s3.credentials.accessKeySecret | quote }}
  {{- if .Values.s3.credentials.sessionToken }}
  {{ .Values.s3.sessionToken }}: {{ .Values.s3.credentials.sessionToken | quote }}
  {{- end }}
{{- end }}
