apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "s3-image-viewer.fullname" . }}
  labels:
    {{- include "s3-image-viewer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "s3-image-viewer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        {{- include "s3-image-viewer.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        hpe-ezua/type: "vendor-service"
        hpe-ezua/app: {{ .Release.Name | quote }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: s3-image-viewer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- if .Values.s3.endpoint }}
            - name: S3_ENDPOINT
              value: {{ .Values.s3.endpoint | quote }}
            {{- end }}
            {{- if not .Values.s3.sslVerify }}
            - name: S3_SSL_VERIFY
              value: "false"
            {{- end }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.s3.region | quote }}
            - name: S3_ADDRESSING_STYLE
              value: {{ .Values.s3.addressingStyle | quote }}
            {{- if or .Values.s3.existingSecret (and .Values.s3.credentials.accessKey .Values.s3.credentials.accessKeySecret) }}
            - name: AWS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "s3-image-viewer.secretName" . }}
                  key: {{ .Values.s3.accessKey }}
            - name: AWS_ACCESS_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "s3-image-viewer.secretName" . }}
                  key: {{ .Values.s3.accessKeySecret }}
            {{- if or .Values.s3.useSessionToken .Values.s3.credentials.sessionToken }}
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "s3-image-viewer.secretName" . }}
                  key: {{ .Values.s3.sessionToken }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /openapi.json
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /openapi.json
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
